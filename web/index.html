<!DOCTYPE html>
<html lang="zh-CN" class="console-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#eef2f9">
  <meta name="description" content="基于 Python 的词云可视化 — 支持语音输入、手动录入与实时词云展示">
  <title>基于Python的词云可视化</title>
  <link rel="stylesheet" href="css/kiosk.css?v=20260620">
</head>
<body class="console-layout">
  <div id="background-layer"></div>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <div class="page-shell">
    <header class="top-bar">
      <div class="top-bar-side top-bar-left">
        <a id="link-display" class="btn-link" href="display.html" target="_blank">打开大屏 ↗</a>
      </div>
      <h1 class="page-title">基于Python的词云可视化</h1>
      <div class="top-bar-side top-bar-right">
        <button id="btn-download" class="btn-download" type="button" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span class="btn-download-text">下载词云图</span>
        </button>
      </div>
    </header>

    <!-- 词云展示区域（置于上方） -->
    <section id="wordcloud-stage" class="wordcloud-stage">
      <div class="shape-customize">
        <h2 class="shape-customize-title">词云形状选择</h2>
        <div class="shape-customize-row">
          <div class="shape-strip" id="shape-strip" role="toolbar" aria-label="词云形状选择"></div>
          <label class="shape-upload-btn" for="mask-upload" title="上传剪影图片">
            <span class="shape-upload-icon" aria-hidden="true">📁</span>
            <span class="shape-upload-label">自定义形状</span>
          </label>
          <input id="mask-upload" type="file" accept="image/*" hidden>
        </div>
      </div>
      <div class="stage-header">
        <div class="stage-header-left">
          <span class="stage-title">实时词云</span>
          <div class="source-tabs" id="source-tabs">
            <button type="button" class="source-tab active" data-source="voice">语音</button>
            <button type="button" class="source-tab" data-source="manual">手动</button>
            <button type="button" class="source-tab" data-source="all">全部</button>
          </div>
        </div>
        <div class="stage-header-right">
          <button id="btn-clear-cloud" class="btn-clear-cloud" type="button" title="清空当前词云显示">清空词云</button>
          <span id="sync-indicator" class="sync-indicator" title="同步状态">● 在线</span>
        </div>
      </div>
      <div class="stage-body stage-body-cloud">
        <div id="shape-outline-guide" class="shape-outline-guide" aria-hidden="true"></div>
        <div id="wordcloud-chart" class="wordcloud-chart"></div>
        <div id="empty-hint" class="empty-hint stage-empty">
          <div class="hint-icon">☁️</div>
          <p>提交词汇后，词云将在此区域动态呈现</p>
          <p class="sub">词语按所选形状轮廓排布 · 词频越高字号越大 · 悬停查看次数</p>
        </div>
      </div>
    </section>

    <aside id="control-panel" class="control-panel">
      <header class="panel-header">
        <h1>控制面板</h1>
        <div class="panel-header-badges">
          <span id="segment-engine" class="segment-badge segment-pending" title="分词引擎">分词检测中</span>
          <span id="speech-status" class="status-badge">就绪</span>
        </div>
      </header>

      <section class="panel-card">
        <h2 class="card-title"><span class="card-icon">🎙</span> 语音输入</h2>
        <div class="rec-controls" id="rec-controls">
          <div class="rec-toolbar" role="toolbar" aria-label="录音控制">
            <button id="btn-rec-start" class="btn-rec btn-rec-start" type="button">开始录音</button>
            <button id="btn-rec-pause" class="btn-rec btn-rec-pause" type="button" disabled>暂停录音</button>
            <button id="btn-rec-end" class="btn-rec btn-rec-end" type="button" disabled>结束录音</button>
          </div>
          <label class="rec-upload-row" for="audio-upload" title="上传音频文件并识别为文字">
            <span class="rec-upload-icon" aria-hidden="true">📤</span> 上传录音
          </label>
          <input id="audio-upload" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.webm" hidden>
        </div>
        <p id="interim-text" class="interim-text"></p>
        <label class="field-label" for="speech-editor">识别结果 <span class="label-tag">可编辑</span></label>
        <textarea id="speech-editor" class="speech-editor" rows="3" placeholder="语音识别内容将显示在这里"></textarea>
        <div class="speech-actions">
          <button id="btn-submit-speech" class="btn-speech-action btn-speech-submit" type="button">提交到词云</button>
          <button id="btn-clear-speech" class="btn-speech-action btn-speech-clear" type="button">清空</button>
        </div>
      </section>

      <section class="panel-card">
        <h2 class="card-title"><span class="card-icon">✏️</span> 手动输入</h2>
        <label class="field-label" for="word-input">文本内容 <span class="label-tag">可编辑</span></label>
        <textarea id="word-input" class="manual-input speech-editor" rows="10" placeholder="在此输入或粘贴需要分词的文本…" spellcheck="false"></textarea>
        <div class="manual-btn-grid" role="toolbar" aria-label="文本操作">
          <button id="btn-add" class="manual-btn manual-btn-append" type="button">提取并追加</button>
          <button id="btn-resegment" class="manual-btn manual-btn-resegment" type="button">重新分词</button>
          <button id="btn-load-demo" class="manual-btn manual-btn-demo" type="button">载入短示例</button>
        </div>
        <p class="field-hint">输入文本后「提取词汇」，在下方核对修改，再「提交词汇」生成词云 · 上方 Ctrl+Enter 快速提取</p>

        <label class="field-label" for="word-list-editor">提取词汇 <span class="label-tag">可编辑 · 可复制</span></label>
        <textarea id="word-list-editor" class="word-list-editor speech-editor" rows="4" spellcheck="false" placeholder="分词结果将显示在此（空格分隔，重复词表示词频）· 修改后点击「提交词汇」"></textarea>
        <div class="manual-btn-grid manual-btn-grid-words" role="toolbar" aria-label="词汇操作">
          <button id="btn-extract-words" class="manual-btn manual-btn-extract" type="button">提取词汇</button>
          <button id="btn-copy-words" class="manual-btn manual-btn-copy" type="button">复制</button>
          <button id="btn-submit-words" class="manual-btn manual-btn-submit" type="button">提交词汇</button>
        </div>
        <p class="field-hint word-list-hint">词汇以空格分隔；同一词出现多次即更高词频 · 可从词库加载当前手动词云</p>
      </section>

      <section class="panel-stats">
        <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">总词次</span></div>
        <div class="stat"><span class="stat-value" id="stat-unique">0</span><span class="stat-label">词云词汇</span></div>
      </section>

      <details class="panel-more">
        <summary>背景与数据管理</summary>
        <div class="more-content">
          <label class="field-label">页面背景</label>
          <div class="color-row" id="bg-colors">
            <button type="button" class="color-swatch active" data-bg="gradient-1"></button>
            <button type="button" class="color-swatch" data-bg="gradient-2"></button>
            <button type="button" class="color-swatch" data-bg="gradient-3"></button>
            <button type="button" class="color-swatch" data-bg="solid-dark"></button>
            <button type="button" class="color-swatch" data-bg="solid-light"></button>
          </div>
          <label class="upload-zone upload-zone-sm" for="bg-upload"><span>上传页面背景图</span></label>
          <input id="bg-upload" type="file" accept="image/*" hidden>
          <label class="field-label">自定义词条 <span class="label-tag">修正误拆词</span></label>
          <textarea id="user-dict-input" class="speech-editor user-dict-input" rows="3" placeholder="每行一个词，如：&#10;人工智能&#10;自然语言处理"></textarea>
          <div class="action-row">
            <button id="btn-save-user-dict" class="btn-secondary" type="button">保存词条</button>
          </div>
          <div class="action-row">
            <button id="btn-export" class="btn-secondary" type="button">导出 JSON</button>
            <button id="btn-reset" class="btn-danger" type="button">清空词云</button>
          </div>
        </div>
      </details>

      <footer class="panel-footer">录入端 · 形状词云 · 版本 20260620 · 数据保存在本机浏览器</footer>
    </aside>
  </div>

  <div id="toast" class="toast" hidden aria-live="polite"></div>
  <div id="boot-error" class="boot-error" hidden>
    <p>页面加载失败</p>
    <p id="boot-error-msg"></p>
  </div>

  <script src="js/vendor/echarts.min.js?v=20260620"></script>
  <script src="js/vendor/echarts-wordcloud.min.js?v=20260620"></script>
  <script src="js/config.js?v=20260620"></script>
  <script src="js/filter.js?v=20260620"></script>
  <script src="js/stopwords.js?v=20260620"></script>
  <script src="js/segment.js?v=20260620"></script>
  <script src="js/masks.js?v=20260620"></script>
  <script src="js/sync.js?v=20260620"></script>
  <script src="js/store.js?v=20260620"></script>
  <script src="js/chart.js?v=20260620"></script>
  <script src="js/demo-sample.js?v=20260620"></script>
  <script src="js/app.js?v=20260620"></script>
</body>
</html>
